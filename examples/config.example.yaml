# The configuration of a made-up shop (docs/reference/configuration.md). Made-up names only.
# Build its database first:  uv run python examples/data/make_shop.py
# Then check it:            uv run semantic-warehouse-mcp --config examples/config.example.yaml --check

instructions: |                              # the team's own rules, for every connection — served as written
  Dates are UTC. Never add amounts of different currencies: group by currency.
vocabularies: [vocabulary/acme.yaml]        # the team's own metadata keys, declared — checked at start
skills: [skills/]                           # folders holding a SKILL.md each: how the team does a kind of task

connections:
  - name: shop
    engine: duckdb
    description: A made-up online shop — customers, paid orders, and the raw events of its site.
    path: data/shop.duckdb                    # relative to this file
    readable: ["marts.*", "dictionaries.*", "raw.events"]
    large_tables:
      - { table: raw.events, bound_by: event_date }
    limits: { rows: 500, seconds: 30 }
    instructions: |                           # for this connection only
      Revenue is net of refunds: amount - refunded_amount.
    context: [context/]                       # documents about this database, read by agents when they need them
    semantic_models: [semantic/]              # Apache Ossie documents: what its tables mean, its metrics

limits:
  answer_characters: 40000                    # clients cut long answers; a cut answer says so

# ClickHouse: see config.clickhouse.example.yaml. Planned, with its milestone (dev/PLAN.md) — not read yet:
#
# query_sets: ["queries/*.yaml"]              # saved, parameterised SQL

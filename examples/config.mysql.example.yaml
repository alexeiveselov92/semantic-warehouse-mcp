# The made-up shop in MySQL (docs/reference/engines.md). Made-up names only.
# Load it into a throwaway server:  uv run python examples/data/make_shop.py --mysql mysql://root:…@localhost:3306
# It makes the read-only user `shop_reader` (password `shop_reader`); name it in the variables below, then:
#   SHOP_MYSQL_USER=shop_reader SHOP_MYSQL_PASSWORD=shop_reader \
#     uv run semantic-warehouse-mcp --config examples/config.mysql.example.yaml --check

connections:
  - name: warehouse
    engine: mysql
    description: A made-up online shop in MySQL — customers, paid orders, and the raw events of its site.
    host: localhost
    port: 3306
    database: marts                           # where an unqualified table name resolves
    user_env: SHOP_MYSQL_USER                 # the variables' names — their values never appear here
    password_env: SHOP_MYSQL_PASSWORD
    tls: on                                   # verify for a server across a network
    readable: ["marts.*", "dictionaries.*", "raw.events"]
    large_tables:
      - { table: raw.events, bound_by: event_date }
    limits: { rows: 500, seconds: 30 }
    semantic_models: [semantic/]              # the same model as the DuckDB example: its tables have the same names

vocabularies: [vocabulary/acme.yaml]

name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexeiveselov92/semantic-warehouse-mcp-web
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A fresh image is on GHCR: tell the hosting repository (pipelab) to redeploy the site. Needs the
  # PIPELAB_DISPATCH_TOKEN secret — a token allowed to send repository_dispatch to pipelab.
  notify-pipelab:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipelab deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PIPELAB_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/alexeiveselov92/pipelab/dispatches \
            -d '{"event_type":"semantic-warehouse-mcp-updated","client_payload":{"sha":"${{ github.sha }}"}}'

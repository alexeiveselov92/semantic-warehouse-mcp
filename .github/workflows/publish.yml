name: publish

# A release: for a tag v<version> — the version pyproject.toml holds — the package is built and published to PyPI by
# trusted publishing (no token: PyPI trusts this workflow in the `pypi` environment). The image is image.yml's.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: build and publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: the tag is the package's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME is not the package's version v$version"; exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      clickhouse:  # a throwaway server for tests/test_clickhouse.py
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: admin
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 2s --health-timeout 2s --health-retries 30
      clickhouse-old:  # one before 24.3, whose analyzer does not run queries: tests/test_clickhouse_before_24_3.py
        image: clickhouse/clickhouse-server:22.11
        env:
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: admin
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8124:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 2s --health-timeout 2s --health-retries 30
      postgres:  # a throwaway server for tests/test_postgres.py
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      mysql:  # a throwaway server for tests/test_mysql.py
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: admin
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -padmin" --health-interval 3s --health-timeout 3s
          --health-retries 40
    env:
      SWM_TEST_CLICKHOUSE_URL: http://localhost:8123
      SWM_TEST_CLICKHOUSE_OLD_URL: http://localhost:8124
      SWM_TEST_POSTGRES_URL: postgresql://postgres:admin@localhost:5432/postgres
      SWM_TEST_MYSQL_URL: mysql://root:admin@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

[project]
name = "semantic-warehouse-mcp"
version = "0.2.0"
description = "A read-only MCP server for SQL databases with a semantic layer in an open format (Apache Ossie), metrics, your own context and skills — for any database and any MCP client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aleksei Veselov" }]
keywords = ["mcp", "model-context-protocol", "sql", "semantic-layer", "ossie", "metrics", "ai-agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "duckdb>=1.3",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "sqlglot>=27",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/alexeiveselov92/semantic-warehouse-mcp"
Documentation = "https://github.com/alexeiveselov92/semantic-warehouse-mcp/blob/main/docs/README.md"
Changelog = "https://github.com/alexeiveselov92/semantic-warehouse-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/alexeiveselov92/semantic-warehouse-mcp/issues"

[project.scripts]
semantic-warehouse-mcp = "semantic_warehouse_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
